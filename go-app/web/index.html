<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>P2TUN — Luxury Black & Gold TUN VPN</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #070709;
      --card-bg: #0e0e12;
      --card-inner: #15151b;
      --gold-primary: #d4af37;
      --gold-light: #f7e7a9;
      --gold-dark: #aa8214;
      --gold-gradient: linear-gradient(135deg, #fcedb6 0%, #d4af37 50%, #aa8214 100%);
      --gold-border: rgba(212, 175, 55, 0.28);
      --gold-glow: rgba(212, 175, 55, 0.35);
      --text-white: #ffffff;
      --text-soft: #e2e8f0;
      --text-muted: #a3a3b3;
      --danger: #e11d48;
      --danger-gradient: linear-gradient(135deg, #fb7185 0%, #e11d48 100%);
      --radius-pill: 9999px;
      --radius-box: 24px;
      --radius-input: 20px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Plus Jakarta Sans', -apple-system, sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    body {
      background: radial-gradient(circle at 50% 0%, #1e1b12 0%, var(--bg) 65%);
      color: var(--text-soft);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 30px 16px;
    }

    .container {
      width: 100%;
      max-width: 620px;
      background: var(--card-bg);
      border: 1.5px solid var(--gold-border);
      border-radius: var(--radius-box);
      box-shadow: 0 25px 65px -15px rgba(0, 0, 0, 0.9), 0 0 35px -10px var(--gold-glow);
      padding: 30px;
      display: flex;
      flex-direction: column;
      gap: 22px;
    }

    /* Header */
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid rgba(212, 175, 55, 0.18);
      padding-bottom: 18px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .logo-badge {
      width: 44px;
      height: 44px;
      border-radius: var(--radius-pill);
      background: var(--gold-gradient);
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 0 16px var(--gold-glow);
    }

    .logo-badge svg {
      width: 24px;
      height: 24px;
      stroke: #000000;
      stroke-width: 2.2;
      fill: none;
    }

    .title-wrap h1 {
      font-family: 'Cinzel', serif;
      font-size: 1.45rem;
      font-weight: 700;
      letter-spacing: 0.04em;
      background: var(--gold-gradient);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .title-wrap p {
      font-size: 0.8rem;
      color: var(--text-muted);
      margin-top: 1px;
    }

    .core-pill {
      font-size: 0.72rem;
      font-weight: 700;
      letter-spacing: 0.05em;
      color: var(--gold-light);
      border: 1px solid var(--gold-border);
      background: rgba(212, 175, 55, 0.08);
      padding: 6px 14px;
      border-radius: var(--radius-pill);
      text-transform: uppercase;
    }

    /* Protocol Pills */
    .protocol-capsule {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      background: var(--card-inner);
      padding: 6px;
      border-radius: var(--radius-pill);
      border: 1.5px solid var(--gold-border);
      gap: 6px;
    }

    .proto-item {
      background: transparent;
      border: none;
      color: var(--text-muted);
      padding: 10px 16px;
      font-size: 0.85rem;
      font-weight: 700;
      border-radius: var(--radius-pill);
      cursor: pointer;
      transition: all 0.25s ease;
      letter-spacing: 0.03em;
    }

    .proto-item:hover {
      color: var(--gold-light);
    }

    .proto-item.active {
      background: var(--gold-gradient);
      color: #000000;
      font-weight: 800;
      box-shadow: 0 4px 14px var(--gold-glow);
    }

    /* Inputs */
    .section-label {
      font-size: 0.72rem;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--gold-primary);
      margin-bottom: -12px;
    }

    .input-row {
      display: grid;
      grid-template-columns: 2fr 1fr;
      gap: 12px;
    }

    .input-row.half {
      grid-template-columns: 1fr 1fr;
    }

    .field-box {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .field-label {
      font-size: 0.8rem;
      font-weight: 600;
      color: var(--text-white);
      display: flex;
      justify-content: space-between;
      padding-left: 8px;
    }

    .probe-link {
      background: transparent;
      border: none;
      color: var(--gold-light);
      cursor: pointer;
      font-size: 0.75rem;
      text-decoration: underline;
      font-weight: 600;
    }
    .probe-link:hover { color: #ffffff; }

    input, select {
      width: 100%;
      background: var(--card-inner);
      border: 1.5px solid var(--gold-border);
      border-radius: var(--radius-input);
      color: var(--text-white);
      padding: 12px 18px;
      font-size: 0.92rem;
      font-weight: 500;
      outline: none;
      transition: all 0.25s ease;
    }

    input:focus, select:focus {
      border-color: var(--gold-primary);
      box-shadow: 0 0 15px var(--gold-glow);
    }

    input::placeholder { color: #646473; }

    /* Switch */
    .option-card {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 20px;
      background: var(--card-inner);
      border: 1.5px solid var(--gold-border);
      border-radius: var(--radius-pill);
    }

    .opt-title { font-size: 0.85rem; font-weight: 700; color: var(--text-white); }
    .opt-desc { font-size: 0.75rem; color: var(--text-muted); }

    .switch {
      position: relative;
      display: inline-block;
      width: 44px;
      height: 24px;
    }
    .switch input { opacity: 0; width: 0; height: 0; }
    .slider {
      position: absolute;
      cursor: pointer;
      top: 0; left: 0; right: 0; bottom: 0;
      background-color: #2b2b36;
      transition: .3s;
      border-radius: var(--radius-pill);
      border: 1px solid var(--gold-border);
    }
    .slider:before {
      position: absolute;
      content: "";
      height: 16px;
      width: 16px;
      left: 3px;
      bottom: 3px;
      background-color: #ffffff;
      transition: .3s;
      border-radius: 50%;
    }
    input:checked + .slider {
      background: var(--gold-gradient);
    }
    input:checked + .slider:before {
      background-color: #000000;
      transform: translateX(20px);
    }

    /* Status Bar */
    .status-capsule {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 18px;
      background: var(--card-inner);
      border: 1px solid rgba(212, 175, 55, 0.25);
      border-radius: var(--radius-pill);
    }

    .status-left {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .pulse-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: #525260;
      position: relative;
    }
    .pulse-dot.active {
      background: var(--gold-primary);
      box-shadow: 0 0 12px var(--gold-primary);
    }

    .status-text {
      font-size: 0.82rem;
      font-weight: 700;
      color: var(--text-muted);
    }
    .status-text.active { color: var(--gold-light); }

    .status-target {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.78rem;
      color: var(--text-white);
    }

    /* Main Button */
    .btn-main {
      width: 100%;
      padding: 15px 24px;
      background: var(--gold-gradient);
      color: #000000;
      border: none;
      border-radius: var(--radius-pill);
      font-family: 'Cinzel', serif;
      font-size: 1.05rem;
      font-weight: 800;
      letter-spacing: 0.06em;
      cursor: pointer;
      box-shadow: 0 8px 24px -4px var(--gold-glow);
      transition: all 0.25s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
    }

    .btn-main:hover {
      transform: translateY(-2px);
      filter: brightness(1.1);
      box-shadow: 0 12px 28px 0px var(--gold-glow);
    }

    .btn-main.connected {
      background: var(--danger-gradient);
      color: #ffffff;
      box-shadow: 0 8px 24px -4px rgba(225, 29, 72, 0.4);
    }

    /* Logs Terminal */
    .term-box {
      border: 1.5px solid var(--gold-border);
      border-radius: var(--radius-box);
      background: #060608;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    .term-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 16px;
      border-bottom: 1px solid rgba(212, 175, 55, 0.15);
      background: #0b0b0e;
      font-size: 0.72rem;
      font-weight: 800;
      letter-spacing: 0.05em;
      color: var(--gold-primary);
      text-transform: uppercase;
    }

    .term-btn {
      background: transparent;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      font-size: 0.75rem;
    }
    .term-btn:hover { color: var(--gold-light); }

    .term-content {
      height: 130px;
      padding: 12px 16px;
      overflow-y: auto;
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.74rem;
      line-height: 1.5;
      color: #e2e8f0;
    }

    .line { white-space: pre-wrap; word-break: break-all; margin-bottom: 2px; }
    .line.info { color: var(--gold-light); }
    .line.err { color: #f87171; }
    .line.ok { color: #86efac; }
  </style>
</head>
<body>

  <div class="container">
    <div class="header">
      <div class="brand">
        <div class="logo-badge">
          <svg viewBox="0 0 24 24"><path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/></svg>
        </div>
        <div class="title-wrap">
          <h1>P2TUN</h1>
          <p>Proxy to Virtual TUN Interface</p>
        </div>
      </div>
      <div class="core-pill">sing-box core</div>
    </div>

    <!-- Protocol Capsules -->
    <div class="protocol-capsule">
      <button class="proto-item active" onclick="setProto('SOCKS5', this)">SOCKS5</button>
      <button class="proto-item" onclick="setProto('SOCKS4', this)">SOCKS4</button>
      <button class="proto-item" onclick="setProto('HTTP', this)">HTTP</button>
    </div>

    <!-- Proxy Target -->
    <div class="section-label">Proxy Target</div>
    <div class="input-row">
      <div class="field-box">
        <div class="field-label">
          <span>Server Host</span>
          <button class="probe-link" onclick="probePort()">Probe Latency</button>
        </div>
        <input type="text" id="host" value="127.0.0.1" placeholder="127.0.0.1">
      </div>
      <div class="field-box">
        <div class="field-label">Port</div>
        <input type="number" id="port" value="1080" placeholder="1080">
      </div>
    </div>

    <!-- Credentials -->
    <div class="section-label">Authentication</div>
    <div class="input-row half">
      <div class="field-box">
        <div class="field-label">Username / ID (Optional)</div>
        <input type="text" id="user" placeholder="Username">
      </div>
      <div class="field-box">
        <div class="field-label">Password (Optional)</div>
        <input type="password" id="pass" placeholder="Password">
      </div>
    </div>

    <!-- TUN Configuration -->
    <div class="section-label">TUN Settings</div>
    <div class="input-row half">
      <div class="field-box">
        <div class="field-label">Network Stack</div>
        <select id="stack">
          <option value="gvisor" selected>gVisor (Userspace)</option>
          <option value="system">System Kernel TUN</option>
          <option value="mixed">Mixed Stack</option>
        </select>
      </div>
      <div class="field-box">
        <div class="field-label">Virtual Adapter</div>
        <input type="text" id="iface" value="tun0" placeholder="tun0 or wintun">
      </div>
    </div>

    <div class="option-card">
      <div>
        <div class="opt-title">Bypass Private LAN</div>
        <div class="opt-desc">Exempt RFC1918 subnets (10.0.0.0/8, 192.168.0.0/16)</div>
      </div>
      <label class="switch">
        <input type="checkbox" id="bypassLan" checked>
        <span class="slider"></span>
      </label>
    </div>

    <!-- Status Capsule -->
    <div class="status-capsule">
      <div class="status-left">
        <div class="pulse-dot" id="statusDot"></div>
        <span class="status-text" id="statusText">DISCONNECTED</span>
      </div>
      <div class="status-target" id="statusTarget"></div>
    </div>

    <!-- Connect Button -->
    <button id="toggleBtn" class="btn-main" onclick="toggleTunnel()">
      <span id="btnLabel">CONNECT TUN INTERFACE</span>
    </button>

    <!-- Terminal -->
    <div class="term-box">
      <div class="term-header">
        <span>Engine Live Output</span>
        <button class="term-btn" onclick="clearLogs()">Clear</button>
      </div>
      <div class="term-content" id="termContent"></div>
    </div>
  </div>

  <script>
    let currentProto = 'SOCKS5';
    let isConnected = false;

    const term = document.getElementById('termContent');
    const toggleBtn = document.getElementById('toggleBtn');
    const btnLabel = document.getElementById('btnLabel');
    const statusDot = document.getElementById('statusDot');
    const statusText = document.getElementById('statusText');
    const statusTarget = document.getElementById('statusTarget');

    function setProto(p, el) {
      currentProto = p;
      document.querySelectorAll('.proto-item').forEach(b => b.classList.remove('active'));
      el.classList.add('active');
      log(`[i] Selected protocol: ${p}`, 'info');
    }

    function clearLogs() { term.innerHTML = ''; }

    function log(msg, cls='normal') {
      const l = document.createElement('div');
      l.className = `line ${cls}`;
      l.textContent = msg;
      term.appendChild(l);
      term.scrollTop = term.scrollHeight;
    }

    function updateUI(running, target='') {
      isConnected = running;
      if (running) {
        toggleBtn.classList.add('connected');
        btnLabel.textContent = 'DISCONNECT TUN INTERFACE';
        statusDot.classList.add('active');
        statusText.classList.add('active');
        statusText.textContent = 'ROUTING ACTIVE';
        statusTarget.textContent = target;
      } else {
        toggleBtn.classList.remove('connected');
        btnLabel.textContent = 'CONNECT TUN INTERFACE';
        statusDot.classList.remove('active');
        statusText.classList.remove('active');
        statusText.textContent = 'DISCONNECTED';
        statusTarget.textContent = '';
      }
    }

    async function probePort() {
      const host = document.getElementById('host').value.trim();
      const port = parseInt(document.getElementById('port').value, 10);
      if (!host || !port) { alert('Enter host and port'); return; }
      log(`[*] Probing ${host}:${port}...`, 'info');
      try {
        const res = await fetch('/api/test', {
          method: 'POST',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({host, port})
        });
        const d = await res.json();
        if (d.ok) log(`[✓] Reachable! Latency: ${d.latency}ms`, 'ok');
        else log(`[!] Probe failed: ${d.error}`, 'err');
      } catch (e) {
        log(`[!] Network error: ${e.message}`, 'err');
      }
    }

    async function checkStatus() {
      try {
        const res = await fetch('/api/status');
        const d = await res.json();
        updateUI(d.running, d.target);
      } catch (e) {}
    }

    async function toggleTunnel() {
      if (isConnected) {
        log('[*] Stopping TUN VPN interface...', 'info');
        await fetch('/api/stop', { method: 'POST' });
        updateUI(false);
      } else {
        const payload = {
          protocol: currentProto,
          host: document.getElementById('host').value.trim(),
          port: parseInt(document.getElementById('port').value, 10),
          username: document.getElementById('user').value.trim(),
          password: document.getElementById('pass').value.trim(),
          stack: document.getElementById('stack').value,
          interface: document.getElementById('iface').value.trim() || 'tun0',
          bypass_lan: document.getElementById('bypassLan').checked
        };
        if (!payload.host || !payload.port) {
          alert('Host and port required');
          return;
        }

        log(`[*] Initiating tunnel -> ${payload.protocol} ${payload.host}:${payload.port}...`, 'info');
        try {
          const res = await fetch('/api/start', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify(payload)
          });
          const d = await res.json();
          if (d.error) {
            log(`[!] Startup failed: ${d.error}`, 'err');
            alert(`Error: ${d.error}`);
          } else {
            updateUI(true, `${payload.protocol} ${payload.host}:${payload.port}`);
          }
        } catch (e) {
          log(`[!] Request error: ${e.message}`, 'err');
        }
      }
    }

    try {
      const ev = new EventSource('/api/events');
      ev.onmessage = (e) => {
        let cls = 'normal';
        const txt = e.data;
        if (txt.includes('FATAL') || txt.includes('ERROR') || txt.includes('[!]')) cls = 'err';
        else if (txt.includes('started') || txt.includes('[*]')) cls = 'info';
        log(txt, cls);
      };
    } catch(e) {}

    setInterval(checkStatus, 3000);
    checkStatus();
  </script>
</body>
</html>
